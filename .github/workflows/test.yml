name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        run: |
          status=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            sh -n "$f" || { echo "syntax error in $f"; status=1; }
          done
          exit $status

      - name: Guard hook test
        run: sh core/files/.claude/hooks/guard.test.sh

      - name: Install and verify smoke runs
        run: |
          set -eu
          # verify_raw DIR: verify an unfilled install. It may fail only on its
          # "no leftover ..." checks (tokens, ADAPT callouts, placeholders),
          # which an unfilled install always trips, and it reports no NOTE.
          verify_raw() {
            out=$(mktemp)
            sh tools/verify.sh --target "$1" >"$out" 2>&1 || true
            cat "$out"
            bad=$(grep '^FAIL' "$out" | grep -v '^FAIL  no leftover ' || true)
            if [ -n "$bad" ]; then
              echo "unexpected verify failures:"
              echo "$bad"
              exit 1
            fi
            if grep -q '^NOTE' "$out"; then echo "a module Append line was not found on a raw install"; exit 1; fi
            grep -q '^PASS  guard push flag matches the merge mode' "$out" || { echo "flag check did not pass"; exit 1; }
            grep -q '^PASS  module Append lines are present' "$out" || { echo "append check did not pass"; exit 1; }
          }
          # smoke NAME MODE INSTALL-ARGS...: install, then verify.
          smoke() {
            name=$1
            mode=$2
            shift 2
            dir=$(mktemp -d)/$name
            LAST_DIR=$dir
            out=$(mktemp)
            echo "== $name (mode $mode) =="
            sh tools/install.sh --target "$dir" --mode "$mode" "$@"
            verify_raw "$dir"
            [ "$(cat "$dir/project/.mode")" = "$mode" ] || { echo "project/.mode is not $mode"; exit 1; }
            if [ "$mode" = solo ]; then want=1; else want=0; fi
            grep -qx "ALLOW_DEFAULT_BRANCH_PUSH=$want" "$dir/.claude/hooks/guard.sh" || { echo "guard flag is not $want"; exit 1; }
            grep -q "\`$mode\` is in force" "$dir/project/working-agreement.md" || { echo "mode not written to working-agreement.md"; exit 1; }
            if [ -d "$dir/.claude/rules" ] && [ -f "$dir/.claude/rules/git.md" ]; then
              [ ! -e "$dir/.claude/rules/git-solo.md" ] && [ ! -e "$dir/.claude/rules/git-review.md" ] || { echo "both git rules installed"; exit 1; }
            fi
            # A second run changes nothing, and a deleted file stays deleted.
            cp "$dir/project/.installed" "$out.list"
            sum1=$(cat "$dir/CLAUDE.md" "$dir/project/working-agreement.md" | cksum)
            rm "$dir/project/GLOSSARY.md"
            sh tools/install.sh --target "$dir" --mode "$mode" "$@" >/dev/null
            cmp "$dir/project/.installed" "$out.list" || { echo ".installed changed on re-run"; exit 1; }
            [ ! -e "$dir/project/GLOSSARY.md" ] || { echo "deleted file came back"; exit 1; }
            sum2=$(cat "$dir/CLAUDE.md" "$dir/project/working-agreement.md" | cksum)
            [ "$sum1" = "$sum2" ] || { echo "re-run changed CLAUDE.md or working-agreement.md"; exit 1; }
          }
          smoke solo-code solo --code
          smoke nocode-privacy solo --modules privacy,no-code
          smoke team-review human-review --code --modules review,team,live-product,privacy,experiments
          smoke oss-builders human-review --code --modules review,open-source,builders
          # Two modules that ship the same file: the second is added under its own heading, with no copy beside it.
          smoke nocode-live solo --modules no-code,live-product
          dir=$LAST_DIR
          grep -qx '## live-product additions' "$dir/project/operations.md" || { echo "second operations.md not merged"; exit 1; }
          [ ! -e "$dir/project/operations.md.project-start" ] || { echo "operations.md.project-start written"; exit 1; }
          # A re-run without --mode keeps the recorded mode; a different --mode stops.
          dir=$(mktemp -d)/rerun
          sh tools/install.sh --target "$dir" --mode human-review --code --modules review >/dev/null
          sh tools/install.sh --target "$dir" --modules sprints >/dev/null
          grep -qx human-review "$dir/project/.mode" || { echo "mode lost on re-run"; exit 1; }
          grep -qx 'ALLOW_DEFAULT_BRANCH_PUSH=0' "$dir/.claude/hooks/guard.sh" || { echo "guard flag changed on re-run"; exit 1; }
          grep -q 'Merge mode human-review' "$dir/project/sprints/_template.md" || { echo "sprint template has the wrong mode"; exit 1; }
          [ "$(head -n 1 "$dir/.claude/rules/git.md")" = '# Git (review)' ] || { echo "git rule changed on re-run"; exit 1; }
          verify_raw "$dir"
          if sh tools/install.sh --target "$dir" --mode solo >/dev/null 2>"$dir/err"; then echo "a different --mode was accepted"; exit 1; fi
          grep -q 'change the mode by hand' "$dir/err" || { echo "no change-by-hand message"; exit 1; }
